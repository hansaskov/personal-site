name: Generate CV PDF

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Generate PDFs
        run: pnpm exec playwright test

      - name: Commit PDFs
        run: |
          git config user.name  "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@users.noreply.forgejo.org"
          git add public/hans-askov-cv*.pdf public/application-letter-*.pdf
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "chore: update CV PDFs [skip ci]"
          git push
